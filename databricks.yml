# Databricks Asset Bundle definition.
# This is the "code" version of what you clicked together manually in the UI
# for training. Batch jobs and serving endpoints were created manually and
# still work fine as-is; they get folded into this bundle later once the
# batch INTERNAL_ERROR issue is resolved - no need to migrate everything at
# once.

bundle:
  name: attrition-promotion-databricks

variables:
  catalog:
    description: Unity Catalog catalog name for this target
  schema:
    default: attrition_promotion

resources:
  jobs:
    train_attrition:
      name: "[${bundle.target}] train-attrition"
      tasks:
        - task_key: train_attrition_model
          spark_python_task:
            python_file: models/attrition/train.py
            parameters: ["${var.catalog}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow
              - scikit-learn
              - pandas
              - numpy

    train_promotion:
      name: "[${bundle.target}] train-promotion"
      tasks:
        - task_key: train_promotion_model
          spark_python_task:
            python_file: models/promotion/train.py
            parameters: ["${var.catalog}"]
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - mlflow
              - scikit-learn
              - pandas
              - numpy

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: ml_dev
    workspace:
      host: https://dbc-78442101-16ef.cloud.databricks.com

  staging:
    mode: production
    variables:
      catalog: ml_staging
    workspace:
      host: https://dbc-78442101-16ef.cloud.databricks.com

  prod:
    mode: production
    variables:
      catalog: ml_prod
    workspace:
      host: https://dbc-78442101-16ef.cloud.databricks.com